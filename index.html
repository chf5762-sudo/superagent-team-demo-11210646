<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Team Demo App</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%); font-family: "Inter", "PingFang SC", system-ui, sans-serif; color: #0f172a; }
  .card { max-width: 560px; padding: 36px; border-radius: 20px; background: rgba(255,255,255,0.97); box-shadow: 0 24px 60px rgba(15,23,42,0.45); }
  h1 { font-size: 24px; line-height: 1.35; margin: 0 0 12px; color: #1e1b4b; }
  p { font-size: 16px; line-height: 1.7; margin: 0; color: #334155; }
</style>
</head>
<body>
  <div class="card">
    <h1>Team Demo Card</h1>
    <p>已根据团队多人协同反馈完成美观度（渐变背景 + 圆角阴影）与字体排版（标题 24px / 正文 16px / 行高 1.7）升级。</p>
  </div>
</body>
</html>
